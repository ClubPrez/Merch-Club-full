kind = "web"
previewPath = "/"
title = "Merch Club"
version = "1.0.0"
id = "artifacts/merch-club"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23739

[services.development]
run = "pnpm --filter @workspace/merch-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/merch-club", "run", "build" ]
publicDir = "artifacts/merch-club/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23739"
BASE_PATH = "/"
