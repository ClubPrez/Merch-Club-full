  # body-parser GHSA-qwcr-r2fm-qrc7
  "body-parser": ">=1.20.3"
  # cookie GHSA-pxg6-pf52-xh8x
  "cookie": ">=0.7.0"
  # send GHSA-m6fv-jmcg-4jfg
  "send": ">=0.19.0"
  # serve-static GHSA-cm22-4g7w-348p
